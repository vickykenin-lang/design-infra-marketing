<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Infra — AURA Dashboard</title>
<style>
  :root{
    --bg:#faf7f2; --surface:#ffffff; --ink:#1f2937; --ink-2:#6b7280; --ink-3:#9ca3af;
    --line:#e5e0d8; --accent:#b45309; --accent-soft:#fdf0e0;
    --good:#166534; --good-bg:#dcfce7; --warn:#92400e; --warn-bg:#fef3c7;
    --bad:#991b1b; --bad-bg:#fee2e2; --pend:#6b7280; --pend-bg:#f3f4f6;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,'Segoe UI','Noto Sans Devanagari',Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;padding-bottom:48px}
  .wrap{max-width:680px;margin:0 auto;padding:16px}
  header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .hrow{max-width:680px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
  .logo{width:38px;height:38px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
  .htxt{flex:1;min-width:0}
  .htxt h1{font-size:16px;font-weight:700}
  .htxt p{font-size:12px;color:var(--ink-2)}
  .lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .lang button{border:0;background:transparent;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink-2)}
  .lang button.on{background:var(--ink);color:#fff}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:14px}
  .card h2{font-size:14px;font-weight:700;letter-spacing:.02em;color:var(--ink-2);text-transform:uppercase;margin-bottom:10px}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
  .pill.green{background:var(--good-bg);color:var(--good)}
  .pill.amber{background:var(--warn-bg);color:var(--warn)}
  .pill.red{background:var(--bad-bg);color:var(--bad)}
  .pill.gray{background:var(--pend-bg);color:var(--pend)}
  .msg{font-size:15px}
  .msg .date{font-size:12px;color:var(--ink-3);margin-bottom:6px}
  .btnrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-size:14px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.danger{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:700}
  .btn:active{transform:scale(.98)}
  .day{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .day:last-child{border-bottom:0}
  .dnum{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
  .dnum.done{background:var(--good-bg);color:var(--good)}
  .dnum.now{background:var(--accent-soft);color:var(--accent);border:2px solid var(--accent)}
  .dnum.todo{background:var(--pend-bg);color:var(--pend)}
  .dtxt{flex:1;min-width:0}
  .dtxt .t{font-size:14px;font-weight:600}
  .dtxt .d{font-size:13px;color:var(--ink-2);margin-top:2px}
  .stat{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  .stat:last-child{border-bottom:0}
  .empty{color:var(--ink-3);font-size:14px;text-align:center;padding:18px 0}
  .note{font-size:12px;color:var(--ink-3);margin-top:10px}
  .meter{height:8px;background:var(--pend-bg);border-radius:999px;overflow:hidden;margin-top:6px}
  .meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
  footer{text-align:center;font-size:12px;color:var(--ink-3);margin-top:22px}
</style>
</head>
<body>
<header><div class="hrow">
  <div class="logo">DI</div>
  <div class="htxt"><h1>Design Infra</h1><p data-en="AURA — AI CEO, Sales &amp; Marketing" data-hi="AURA — AI CEO, सेल्स और मार्केटिंग"></p></div>
  <div class="lang"><button id="btnHi" onclick="setLang('hi')">हिंदी</button><button id="btnEn" onclick="setLang('en')">EN</button></div>
</div></header>

<div class="wrap">

  <div class="card" id="statusCard">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2 style="margin:0" data-en="System status" data-hi="सिस्टम की स्थिति"></h2>
      <span class="pill green" id="overallPill">✓ <span data-en="All good" data-hi="सब ठीक है"></span></span>
    </div>
    <p class="note" id="overallNote"></p>
  </div>

  <div class="card">
    <h2 data-en="AURA's message" data-hi="AURA का संदेश"></h2>
    <div class="msg" id="msgBox"><div class="empty">…</div></div>
    <div class="btnrow">
      <button class="btn" onclick="speakMsg()">🔊 <span data-en="Listen" data-hi="सुनें"></span></button>
      <button class="btn" onclick="startMic()">🎙️ <span data-en="Speak to AURA" data-hi="AURA से बोलें"></span></button>
      <a class="btn" id="writeLink" target="_blank">✍️ <span data-en="Write to AURA" data-hi="AURA को लिखें"></span></a>
    </div>
    <p class="note" data-en="Your message is saved on GitHub. AURA reads and acts on it at the next scheduled run (within a few hours)." data-hi="आपका संदेश GitHub पर सेव होता है। AURA अगले तय रन पर (कुछ घंटों के अंदर) उसे पढ़कर काम करती है।"></p>
  </div>

  <div class="card">
    <h2 data-en="7-day build plan" data-hi="7 दिन का निर्माण प्लान"></h2>
    <div class="meter"><i id="meterFill" style="width:7%"></i></div>
    <div id="planBox" style="margin-top:8px"></div>
  </div>

  <div class="card">
    <h2 data-en="Today's activity" data-hi="आज की गतिविधि"></h2>
    <div class="empty" data-en="No posts yet — the content engine arrives on Day 3–4." data-hi="अभी कोई पोस्ट नहीं — कंटेंट इंजन दिन 3–4 पर आएगा।"></div>
  </div>

  <div class="card">
    <h2 data-en="Leads" data-hi="लीड्स (ग्राहक पूछताछ)"></h2>
    <div class="empty" data-en="No leads captured yet — the Lead Manager arrives on Day 5." data-hi="अभी कोई लीड नहीं — लीड मैनेजर दिन 5 पर आएगा।"></div>
  </div>

  <div class="card">
    <h2 data-en="System health" data-hi="सिस्टम हेल्थ"></h2>
    <div id="healthBox"></div>
    <div class="stat"><span data-en="GitHub Actions minutes used" data-hi="GitHub Actions मिनट (इस्तेमाल)"></span><b id="minsUsed">0 / 2000</b></div>
    <div class="btnrow" style="margin-top:14px">
      <a class="btn danger" id="killLink" target="_blank">🔴 <span data-en="KILL SWITCH — pause all posting" data-hi="किल स्विच — सारी पोस्टिंग रोकें"></span></a>
    </div>
    <p class="note" data-en="Tapping the kill switch opens a one-tap GitHub form. Publishing stops at the very next run." data-hi="किल स्विच दबाने पर GitHub का एक-टैप फ़ॉर्म खुलता है। अगले ही रन से पोस्टिंग रुक जाती है।"></p>
  </div>

  <footer>Design Infra · AURA v0.1 · <span data-en="Built with zero cost, runs in the cloud" data-hi="ज़ीरो लागत, क्लाउड में चलता है"></span></footer>
</div>

<script>
const REPO = 'vickykenin-lang/design-infra-marketing';
let LANG = localStorage.getItem('aura_lang') || 'hi';
let LAST_MSG = {en:'',hi:''};

function setLang(l){
  LANG=l; localStorage.setItem('aura_lang',l);
  document.getElementById('btnHi').classList.toggle('on',l==='hi');
  document.getElementById('btnEn').classList.toggle('on',l==='en');
  document.querySelectorAll('[data-en]').forEach(el=>{ el.textContent = el.dataset[l] || el.dataset.en; });
  render();
}

const INLINE={
progress:{"updated":"2026-08-14","plan":[
 {"day":1,"title_en":"Foundation — repo, dashboard, company profile, API keys","title_hi":"नींव — रिपॉज़िटरी, डैशबोर्ड, कंपनी प्रोफ़ाइल, API keys","status":"in_progress","detail_en":"Repo created, dashboard live, company profile captured. Next: AI API keys, then Meta & Pinterest apps.","detail_hi":"रिपॉज़िटरी बनी, डैशबोर्ड लाइव, कंपनी प्रोफ़ाइल दर्ज। आगे: AI API keys, फिर Meta और Pinterest ऐप।"},
 {"day":2,"title_en":"Brand + Strategy — voice, pillars, first content calendar","title_hi":"ब्रांड + रणनीति — आवाज़, कंटेंट पिलर, पहला कैलेंडर","status":"pending","detail_en":"","detail_hi":""},
 {"day":3,"title_en":"Content engine — Copywriter + Visual Designer","title_hi":"कंटेंट इंजन — कॉपीराइटर + विज़ुअल डिज़ाइनर","status":"pending","detail_en":"","detail_hi":""},
 {"day":4,"title_en":"Publishing engine — auto-posting via GitHub Actions","title_hi":"पब्लिशिंग इंजन — GitHub Actions से ऑटो-पोस्टिंग","status":"pending","detail_en":"","detail_hi":""},
 {"day":5,"title_en":"Leads + Analytics — capture page, scoring, daily report","title_hi":"लीड्स + एनालिटिक्स — कैप्चर पेज, स्कोरिंग, डेली रिपोर्ट","status":"pending","detail_en":"","detail_hi":""},
 {"day":6,"title_en":"Communication + Voice — bilingual panel, kill switch test","title_hi":"संवाद + आवाज़ — द्विभाषी पैनल, किल स्विच टेस्ट","status":"pending","detail_en":"","detail_hi":""},
 {"day":7,"title_en":"Full dress rehearsal + handover guide","title_hi":"फ़ुल रिहर्सल + हैंडओवर गाइड","status":"pending","detail_en":"","detail_hi":""}]},
status:{"updated":"2026-08-14","overall":"green","overall_note_en":"Day 1 build in progress. No automation running yet.","overall_note_hi":"दिन 1 का निर्माण जारी। अभी कोई ऑटोमेशन नहीं चल रहा।","kill_switch":false,"actions_minutes_used":0,"actions_minutes_budget":2000,"components":[{"name":"Dashboard","status":"green"},{"name":"Content engine","status":"pending"},{"name":"Publisher (Instagram)","status":"pending"},{"name":"Publisher (Pinterest)","status":"pending"},{"name":"Lead Manager","status":"pending"},{"name":"Analyst","status":"pending"}]},
messages:{"updated":"2026-08-14","messages":[{"date":"2026-08-14","from":"AURA","en":"Namaste Vickey! Your marketing system's foundation is ready. This dashboard is your window into everything — progress, posts, leads and my decisions. Today I captured Design Infra's profile and set our four brand differentiators. Next: free AI API keys, then Instagram and Pinterest connections.","hi":"नमस्ते विकी जी! आपके मार्केटिंग सिस्टम की नींव तैयार है। यह डैशबोर्ड आपकी खिड़की है — प्रगति, पोस्ट, लीड्स और मेरे फ़ैसले, सब यहीं दिखेंगे। आज मैंने Design Infra की प्रोफ़ाइल दर्ज की और ब्रांड की 4 ख़ास बातें तय कीं। आगे: मुफ़्त AI API keys, फिर Instagram और Pinterest कनेक्शन।"}]}
};
let DATA={progress:INLINE.progress,status:INLINE.status,messages:INLINE.messages};
async function load(){
  const bust='?t='+Date.now();
  for(const f of ['progress','status','messages']){
    try{ const r=await fetch('data/'+f+'.json'+bust); if(r.ok) DATA[f]=await r.json(); }catch(e){}
  }
  render();
}

function render(){
  const t=(o,k)=>o?(o[k+'_'+LANG]||o[k+'_en']||''):'';
  // status
  const s=DATA.status;
  if(s){
    const pill=document.getElementById('overallPill');
    const map={green:['green','✓',LANG==='hi'?'सब ठीक है':'All good'],amber:['amber','⚠',LANG==='hi'?'ध्यान दें':'Attention'],red:['red','✖',LANG==='hi'?'समस्या है':'Problem']};
    const m=map[s.kill_switch?'red':s.overall]||map.green;
    pill.className='pill '+m[0]; pill.innerHTML=m[1]+' '+(s.kill_switch?(LANG==='hi'?'रुका हुआ (किल स्विच)':'Paused (kill switch)'):m[2]);
    document.getElementById('overallNote').textContent=t(s,'overall_note');
    document.getElementById('minsUsed').textContent=(s.actions_minutes_used||0)+' / '+(s.actions_minutes_budget||2000);
    const hb=document.getElementById('healthBox'); hb.innerHTML='';
    (s.components||[]).forEach(c=>{
      const cls=c.status==='green'?'green':(c.status==='red'?'red':(c.status==='amber'?'amber':'gray'));
      const lbl={green:LANG==='hi'?'चालू':'Running',red:LANG==='hi'?'बंद':'Down',amber:LANG==='hi'?'ध्यान':'Warning',gray:LANG==='hi'?'बनना बाक़ी':'Not built yet'}[cls];
      const ico={green:'✓',red:'✖',amber:'⚠',gray:'○'}[cls];
      hb.innerHTML+='<div class="stat"><span>'+c.name+'</span><span class="pill '+cls+'">'+ico+' '+lbl+'</span></div>';
    });
  }
  // message
  const ms=DATA.messages;
  if(ms&&ms.messages&&ms.messages.length){
    const m=ms.messages[ms.messages.length-1];
    LAST_MSG={en:m.en,hi:m.hi};
    document.getElementById('msgBox').innerHTML='<div class="date">'+m.date+' · '+m.from+'</div><div>'+(LANG==='hi'?m.hi:m.en)+'</div>';
  }
  // plan
  const p=DATA.progress;
  if(p){
    const pb=document.getElementById('planBox'); pb.innerHTML='';
    let done=0;
    p.plan.forEach(d=>{
      if(d.status==='done')done++;
      const cls=d.status==='done'?'done':(d.status==='in_progress'?'now':'todo');
      const mark=d.status==='done'?'✓':d.day;
      pb.innerHTML+='<div class="day"><div class="dnum '+cls+'">'+mark+'</div><div class="dtxt"><div class="t">'+t(d,'title')+'</div>'+(t(d,'detail')?'<div class="d">'+t(d,'detail')+'</div>':'')+'</div></div>';
    });
    const prog=Math.max(7,Math.round((done+(p.plan.some(d=>d.status==='in_progress')?0.5:0))/7*100));
    document.getElementById('meterFill').style.width=prog+'%';
  }
  // action links
  const wl=document.getElementById('writeLink');
  wl.href='https://github.com/'+REPO+'/issues/new?title='+encodeURIComponent('MESSAGE TO AURA')+'&labels=owner-message&body='+encodeURIComponent(LANG==='hi'?'यहाँ अपना संदेश लिखें:\n\n':'Write your message here:\n\n');
  const kl=document.getElementById('killLink');
  kl.href='https://github.com/'+REPO+'/issues/new?title='+encodeURIComponent('KILL SWITCH: PAUSE ALL PUBLISHING')+'&labels=kill-switch&body='+encodeURIComponent('Submit this issue to pause all posting immediately at the next run. / यह सबमिट करते ही अगली रन से सारी पोस्टिंग रुक जाएगी।');
}

function speakMsg(){
  const txt=LANG==='hi'?LAST_MSG.hi:LAST_MSG.en;
  if(!txt)return;
  const u=new SpeechSynthesisUtterance(txt);
  u.lang=LANG==='hi'?'hi-IN':'en-IN';
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

function startMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert(LANG==='hi'?'माफ़ कीजिए, इस ब्राउज़र में माइक सपोर्ट नहीं है। ✍️ बटन से लिखकर भेजें।':'Sorry, this browser does not support the mic. Use the ✍️ button instead.');return;}
  const r=new SR(); r.lang=LANG==='hi'?'hi-IN':'en-IN'; r.interimResults=false;
  r.onresult=e=>{
    const said=e.results[0][0].transcript;
    window.open('https://github.com/'+REPO+'/issues/new?title='+encodeURIComponent('MESSAGE TO AURA (voice)')+'&labels=owner-message&body='+encodeURIComponent(said),'_blank');
  };
  r.onerror=()=>alert(LANG==='hi'?'सुनाई नहीं दिया — फिर कोशिश करें।':'Could not hear you — please try again.');
  r.start();
}

setLang(LANG); load(); setInterval(load,120000);
</script>
</body>
</html>
