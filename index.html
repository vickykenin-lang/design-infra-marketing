<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1115">
<title>Design Infra — AURA Dashboard</title>
<style>
  :root{
    --bg:#faf7f2; --surface:#ffffff; --ink:#1f2937; --ink-2:#6b7280; --ink-3:#9ca3af;
    --line:#e8e2d8; --accent:#b45309; --accent-2:#d97706; --accent-soft:#fdf0e0;
    --good:#166534; --good-bg:#dcfce7; --warn:#92400e; --warn-bg:#fef3c7;
    --bad:#991b1b; --bad-bg:#fee2e2; --pend:#6b7280; --pend-bg:#f3f4f6;
    --radius:16px; --shadow:0 1px 3px rgba(31,41,55,.06),0 8px 24px rgba(31,41,55,.05);
  }
  body.dark{
    --bg:#0f1115; --surface:#171a21; --ink:#e5e7eb; --ink-2:#9ca3af; --ink-3:#6b7280;
    --line:#262a33; --accent:#e8963e; --accent-2:#f0a952; --accent-soft:#2a2119;
    --good:#4ade80; --good-bg:#14351f; --warn:#fbbf24; --warn-bg:#332708;
    --bad:#f87171; --bad-bg:#3a1414; --pend:#9ca3af; --pend-bg:#232730;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:-apple-system,'Segoe UI','Noto Sans Devanagari',Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;padding-bottom:56px;transition:background .4s,color .4s}
  .wrap{max-width:680px;margin:0 auto;padding:16px}

  /* header */
  header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .gbar{height:3px;background:linear-gradient(90deg,#b45309,#d97706,#f59e0b,#d97706,#b45309);background-size:300% 100%;animation:flow 6s linear infinite}
  @keyframes flow{0%{background-position:0 0}100%{background-position:300% 0}}
  .hrow{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
  .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;box-shadow:var(--shadow)}
  .htxt{flex:1;min-width:0}
  .htxt h1{font-size:16px;font-weight:800;letter-spacing:.01em}
  .htxt p{font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:36px;height:36px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .lang button{border:0;background:transparent;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--ink-2);transition:all .25s}
  .lang button.on{background:var(--ink);color:var(--bg);font-weight:700}

  /* hero strip */
  .hero{margin-top:14px;border-radius:var(--radius);padding:18px;color:#fff;background:linear-gradient(135deg,#1c1917 0%,#44403c 55%,#78350f 130%);box-shadow:var(--shadow);position:relative;overflow:hidden}
  .hero::after{content:'';position:absolute;top:-60%;right:-20%;width:70%;height:220%;background:radial-gradient(closest-side,rgba(245,158,11,.28),transparent);animation:glow 5s ease-in-out infinite alternate}
  @keyframes glow{from{opacity:.5;transform:translateX(0)}to{opacity:1;transform:translateX(-14px)}}
  .hero .hi{font-size:12px;opacity:.85;letter-spacing:.08em;text-transform:uppercase}
  .hero .big{font-size:20px;font-weight:800;margin-top:2px}
  .hero .clock{font-size:12.5px;opacity:.85;margin-top:6px;font-variant-numeric:tabular-nums}
  .hero .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ade80;margin-right:6px;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(74,222,128,.55)}50%{box-shadow:0 0 0 7px rgba(74,222,128,0)}}

  /* stat tiles */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
  .tile b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent)}
  .tile span{font-size:11px;color:var(--ink-2);display:block;margin-top:2px;line-height:1.3}
  @media(max-width:420px){.tile b{font-size:19px}}

  /* cards */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:14px;box-shadow:var(--shadow);opacity:0;transform:translateY(14px);animation:rise .5s forwards}
  .card:nth-of-type(2){animation-delay:.06s}.card:nth-of-type(3){animation-delay:.12s}.card:nth-of-type(4){animation-delay:.18s}.card:nth-of-type(5){animation-delay:.24s}.card:nth-of-type(6){animation-delay:.3s}
  @keyframes rise{to{opacity:1;transform:none}}
  .card h2{font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--ink-2);text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px;transition:all .3s}
  .pill.green{background:var(--good-bg);color:var(--good)}
  .pill.amber{background:var(--warn-bg);color:var(--warn)}
  .pill.red{background:var(--bad-bg);color:var(--bad)}
  .pill.gray{background:var(--pend-bg);color:var(--pend)}

  .msg{font-size:15px}
  .msg .date{font-size:12px;color:var(--ink-3);margin-bottom:6px}
  .btnrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-size:14px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:6px;text-decoration:none;transition:transform .15s,box-shadow .2s}
  .btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.danger{background:#b91c1c;border-color:#b91c1c;color:#fff;font-weight:700}
  .btn.speaking{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

  /* timeline */
  .meter{height:9px;background:var(--pend-bg);border-radius:999px;overflow:hidden;margin-top:6px;position:relative}
  .meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:999px;width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
  .meter i::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 2.2s infinite}
  @keyframes shine{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
  .tl{position:relative;margin-top:12px}
  .tl::before{content:'';position:absolute;left:17px;top:8px;bottom:8px;width:2px;background:var(--line)}
  .day{display:flex;gap:12px;padding:9px 0;position:relative}
  .dnum{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;z-index:1;border:2px solid var(--surface)}
  .dnum.done{background:var(--good-bg);color:var(--good)}
  .dnum.now{background:var(--accent-soft);color:var(--accent);border:2px solid var(--accent);animation:nowpulse 2s infinite}
  @keyframes nowpulse{0%,100%{box-shadow:0 0 0 0 rgba(217,119,6,.35)}50%{box-shadow:0 0 0 8px rgba(217,119,6,0)}}
  .dnum.todo{background:var(--pend-bg);color:var(--pend)}
  .dtxt{flex:1;min-width:0;padding-top:2px}
  .dtxt .t{font-size:14px;font-weight:700}
  .dtxt .d{font-size:13px;color:var(--ink-2);margin-top:2px}

  .stat{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;gap:10px}
  .stat:last-child{border-bottom:0}
  .empty{color:var(--ink-3);font-size:14px;text-align:center;padding:20px 0}
  .empty .ico{font-size:26px;display:block;margin-bottom:6px;opacity:.7}
  .note{font-size:12px;color:var(--ink-3);margin-top:10px}
  footer{text-align:center;font-size:12px;color:var(--ink-3);margin-top:24px}
  .appr{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
  .appr:last-child{border-bottom:0}
  .appr img{width:84px;height:105px;object-fit:cover;border-radius:10px;flex-shrink:0;border:1px solid var(--line)}
  .appr .ainfo{flex:1;min-width:0}
  .appr .ad{font-size:12px;color:var(--ink-3)}
  .appr .ah{font-size:14.5px;font-weight:700;line-height:1.3;margin:2px 0 8px}
  .abtn{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;font-weight:700;padding:7px 13px;border-radius:9px;text-decoration:none;margin-right:6px}
  .abtn.ok{background:var(--good-bg);color:var(--good)}
  .abtn.no{background:var(--bad-bg);color:var(--bad)}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13.5px;transition:transform .35s;z-index:50;max-width:90vw;text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <div class="gbar"></div>
  <div class="hrow">
    <div class="logo">DI</div>
    <div class="htxt"><h1>Design Infra</h1><p data-en="AURA — AI CEO, Sales &amp; Marketing" data-hi="AURA — AI CEO, सेल्स और मार्केटिंग"></p></div>
    <button class="hbtn" id="themeBtn" title="Theme">🌙</button>
    <div class="lang"><button id="btnHi" onclick="setLang('hi')">हिंदी</button><button id="btnEn" onclick="setLang('en')">EN</button></div>
  </div>
</header>

<div class="wrap">

  <div class="hero">
    <div class="hi" data-en="Mission control" data-hi="मिशन कंट्रोल"></div>
    <div class="big" id="greet"></div>
    <div class="clock"><span class="dot"></span><span id="clock"></span> · <span id="sysline" data-en="System: building (Day 1 of 7)" data-hi="सिस्टम: निर्माण जारी (दिन 1/7)"></span></div>
  </div>

  <div class="tiles">
    <div class="tile"><b class="cnt" data-v="0">0</b><span data-en="Posts published" data-hi="पोस्ट छपीं"></span></div>
    <div class="tile"><b class="cnt" data-v="0">0</b><span data-en="Scheduled" data-hi="कतार में"></span></div>
    <div class="tile"><b class="cnt" data-v="0">0</b><span data-en="Leads" data-hi="लीड्स"></span></div>
    <div class="tile"><b class="cnt" data-v="0">0</b><span data-en="Total reach" data-hi="कुल पहुँच"></span></div>
  </div>

  <div class="card" id="statusCard">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2 style="margin:0" data-en="System status" data-hi="सिस्टम की स्थिति"></h2>
      <span class="pill green" id="overallPill">✓ <span data-en="All good" data-hi="सब ठीक है"></span></span>
    </div>
    <p class="note" id="overallNote"></p>
  </div>

  <div class="card">
    <h2>💬 <span data-en="AURA's message" data-hi="AURA का संदेश"></span></h2>
    <div class="msg" id="msgBox"><div class="empty">…</div></div>
    <div class="btnrow">
      <button class="btn" id="speakBtn" onclick="speakMsg()">🔊 <span data-en="Listen" data-hi="सुनें"></span></button>
      <button class="btn" onclick="startMic()">🎙️ <span data-en="Speak to AURA" data-hi="AURA से बोलें"></span></button>
      <a class="btn" id="writeLink" target="_blank">✍️ <span data-en="Write to AURA" data-hi="AURA को लिखें"></span></a>
    </div>
    <p class="note" data-en="Your message is saved on GitHub. AURA reads and acts on it at the next scheduled run (within a few hours)." data-hi="आपका संदेश GitHub पर सेव होता है। AURA अगले तय रन पर (कुछ घंटों के अंदर) उसे पढ़कर काम करती है।"></p>
  </div>

  <div class="card">
    <h2>🗓️ <span data-en="7-day build plan" data-hi="7 दिन का निर्माण प्लान"></span></h2>
    <div class="meter"><i id="meterFill"></i></div>
    <div class="tl" id="planBox"></div>
  </div>

  <div class="card">
    <h2>📸 <span data-en="Post approvals — your tap decides" data-hi="पोस्ट मंज़ूरी — आपका एक टैप फ़ैसला करेगा"></span></h2>
    <p class="note" style="margin:0 0 12px" data-en="Nothing publishes without your approval. Tap ✅ or ❌ — a one-tap GitHub form opens; your decision takes effect within minutes." data-hi="आपकी मंज़ूरी के बिना कुछ नहीं छपेगा। ✅ या ❌ दबाइए — GitHub का एक-टैप फ़ॉर्म खुलेगा; फ़ैसला कुछ मिनटों में लागू हो जाएगा।"></p>
    <div id="approvalBox"><div class="empty">…</div></div>
  </div>

  <div class="card">
    <h2>🤝 <span data-en="Leads" data-hi="लीड्स (ग्राहक पूछताछ)"></span></h2>
    <p class="note" id="leadsSummary" style="margin:0 0 10px"></p>
    <div id="leadsBox"><div class="empty">…</div></div>
    <div class="btnrow">
      <a class="btn" id="logLeadLink" target="_blank">➕ <span data-en="Log a new lead" data-hi="नई लीड दर्ज करें"></span></a>
      <a class="btn" href="leads.html" target="_blank">🔗 <span data-en="Open public inquiry form" data-hi="पब्लिक पूछताछ फ़ॉर्म खोलें"></span></a>
    </div>
    <p class="note" data-en="Public visitors use the inquiry form (leads.html) — share that link in your Instagram/Pinterest bio. Use 'Log a new lead' for inquiries that come by phone, WhatsApp or in person." data-hi="आम विज़िटर पूछताछ फ़ॉर्म (leads.html) इस्तेमाल करते हैं — यह लिंक अपने Instagram/Pinterest बायो में डालें। फ़ोन, WhatsApp या सीधे मिलने वाली पूछताछ के लिए 'नई लीड दर्ज करें' इस्तेमाल करें।"></p>
  </div>

  <div class="card">
    <h2>🩺 <span data-en="System health" data-hi="सिस्टम हेल्थ"></span></h2>
    <div id="healthBox"></div>
    <div class="stat"><span data-en="GitHub Actions minutes used" data-hi="GitHub Actions मिनट (इस्तेमाल)"></span><b id="minsUsed">0 / 2000</b></div>
    <div class="btnrow" style="margin-top:14px">
      <a class="btn danger" id="killLink" target="_blank">🔴 <span data-en="KILL SWITCH — pause all posting" data-hi="किल स्विच — सारी पोस्टिंग रोकें"></span></a>
    </div>
    <p class="note" data-en="Tapping the kill switch opens a one-tap GitHub form. Publishing stops at the very next run." data-hi="किल स्विच दबाने पर GitHub का एक-टैप फ़ॉर्म खुलता है। अगले ही रन से पोस्टिंग रुक जाती है।"></p>
  </div>

  <footer>Design Infra · AURA v0.5 · <span data-en="Zero cost, runs in the cloud" data-hi="ज़ीरो लागत, क्लाउड में चलता है"></span></footer>
</div>
<div class="toast" id="toast"></div>

<script>
const REPO='vickykenin-lang/design-infra-marketing';
let LANG=localStorage.getItem('aura_lang')||'hi';
let LAST_MSG={en:'',hi:''};

const INLINE={
progress:{"updated":"2026-08-14","plan":[
 {"day":1,"title_en":"Foundation — repo, dashboard, company profile, API keys","title_hi":"नींव — रिपॉज़िटरी, डैशबोर्ड, कंपनी प्रोफ़ाइल, API keys","status":"in_progress","detail_en":"Repo created, dashboard live, company profile captured. Next: AI API keys.","detail_hi":"रिपॉज़िटरी बनी, डैशबोर्ड लाइव, कंपनी प्रोफ़ाइल दर्ज। आगे: AI API keys।"},
 {"day":2,"title_en":"Brand + Strategy — voice, pillars, first content calendar","title_hi":"ब्रांड + रणनीति — आवाज़, कंटेंट पिलर, पहला कैलेंडर","status":"pending","detail_en":"","detail_hi":""},
 {"day":3,"title_en":"Content engine — Copywriter + Visual Designer","title_hi":"कंटेंट इंजन — कॉपीराइटर + विज़ुअल डिज़ाइनर","status":"pending","detail_en":"","detail_hi":""},
 {"day":4,"title_en":"Publishing engine — auto-posting via GitHub Actions","title_hi":"पब्लिशिंग इंजन — GitHub Actions से ऑटो-पोस्टिंग","status":"pending","detail_en":"","detail_hi":""},
 {"day":5,"title_en":"Leads + Analytics — capture page, scoring, daily report","title_hi":"लीड्स + एनालिटिक्स — कैप्चर पेज, स्कोरिंग, डेली रिपोर्ट","status":"pending","detail_en":"","detail_hi":""},
 {"day":6,"title_en":"Communication + Voice — bilingual panel, kill switch test","title_hi":"संवाद + आवाज़ — द्विभाषी पैनल, किल स्विच टेस्ट","status":"pending","detail_en":"","detail_hi":""},
 {"day":7,"title_en":"Full dress rehearsal + handover guide","title_hi":"फ़ुल रिहर्सल + हैंडओवर गाइड","status":"pending","detail_en":"","detail_hi":""}]},
status:{"updated":"2026-08-14","overall":"green","overall_note_en":"Day 1 build in progress. No automation running yet.","overall_note_hi":"दिन 1 का निर्माण जारी। अभी कोई ऑटोमेशन नहीं चल रहा।","kill_switch":false,"actions_minutes_used":0,"actions_minutes_budget":2000,"stats":{"posts":0,"scheduled":0,"leads":0,"reach":0},"components":[{"name":"Dashboard","status":"green"},{"name":"Content engine","status":"pending"},{"name":"Publisher (Instagram)","status":"pending"},{"name":"Publisher (Pinterest)","status":"pending"},{"name":"Lead Manager","status":"pending"},{"name":"Analyst","status":"pending"}]},
messages:{"updated":"2026-08-14","messages":[{"date":"2026-08-14","from":"AURA","en":"Namaste Vickey! Your marketing system's foundation is ready. This dashboard is your window into everything — progress, posts, leads and my decisions. Today I captured Design Infra's profile and set our four brand differentiators. Next: free AI API keys, then Instagram and Pinterest connections.","hi":"नमस्ते विकी जी! आपके मार्केटिंग सिस्टम की नींव तैयार है। यह डैशबोर्ड आपकी खिड़की है — प्रगति, पोस्ट, लीड्स और मेरे फ़ैसले, सब यहीं दिखेंगे। आज मैंने Design Infra की प्रोफ़ाइल दर्ज की और ब्रांड की 4 ख़ास बातें तय कीं। आगे: मुफ़्त AI API keys, फिर Instagram और Pinterest कनेक्शन।"}]}
};
let DATA={progress:INLINE.progress,status:INLINE.status,messages:INLINE.messages};

function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600);}

/* theme */
function setTheme(t){document.body.classList.toggle('dark',t==='dark');localStorage.setItem('aura_theme',t);document.getElementById('themeBtn').textContent=t==='dark'?'☀️':'🌙';}
document.getElementById('themeBtn').onclick=()=>setTheme(document.body.classList.contains('dark')?'light':'dark');
setTheme(localStorage.getItem('aura_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));

/* clock + greeting */
function tick(){
  const n=new Date();
  const opts={hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true};
  document.getElementById('clock').textContent=n.toLocaleDateString(LANG==='hi'?'hi-IN':'en-IN',{weekday:'short',day:'numeric',month:'short'})+' · '+n.toLocaleTimeString('en-IN',opts);
  const h=n.getHours();
  const g=LANG==='hi'?(h<12?'शुभ प्रभात, विकी जी ☀️':h<17?'नमस्ते, विकी जी 👋':'शुभ संध्या, विकी जी 🌆'):(h<12?'Good morning, Vickey ☀️':h<17?'Hello, Vickey 👋':'Good evening, Vickey 🌆');
  document.getElementById('greet').textContent=g;
}
setInterval(tick,1000);

/* count-up tiles */
function countUp(){
  document.querySelectorAll('.cnt').forEach(el=>{
    const target=+el.dataset.v||0,cur=+el.textContent||0;
    if(cur===target)return;
    const t0=performance.now(),dur=900,from=cur;
    (function step(t){const p=Math.min(1,(t-t0)/dur);el.textContent=Math.round(from+(target-from)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step);})(t0);
  });
}

function setLang(l){
  LANG=l;localStorage.setItem('aura_lang',l);
  document.getElementById('btnHi').classList.toggle('on',l==='hi');
  document.getElementById('btnEn').classList.toggle('on',l==='en');
  document.querySelectorAll('[data-en]').forEach(el=>{el.innerHTML=el.dataset[l]||el.dataset.en;});
  tick();render();
}

async function load(){
  const bust='?t='+Date.now();
  for(const f of ['progress','status','messages','approvals','qa_report','customer_report','leads','lead_daily_report']){
    try{const r=await fetch('data/'+f+'.json'+bust);if(r.ok)DATA[f]=await r.json();}catch(e){}
  }
  try{const r=await fetch('content/calendar.json'+bust);if(r.ok)DATA.cal=await r.json();}catch(e){}
  render();
}

function render(){
  const t=(o,k)=>o?(o[k+'_'+LANG]||o[k+'_en']||''):'';
  const s=DATA.status;
  if(s){
    const pill=document.getElementById('overallPill');
    const map={green:['green','✓',LANG==='hi'?'सब ठीक है':'All good'],amber:['amber','⚠',LANG==='hi'?'ध्यान दें':'Attention'],red:['red','✖',LANG==='hi'?'समस्या है':'Problem']};
    const m=map[s.kill_switch?'red':s.overall]||map.green;
    pill.className='pill '+m[0];pill.innerHTML=m[1]+' '+(s.kill_switch?(LANG==='hi'?'रुका हुआ (किल स्विच)':'Paused (kill switch)'):m[2]);
    document.getElementById('overallNote').textContent=t(s,'overall_note');
    document.getElementById('minsUsed').textContent=(s.actions_minutes_used||0)+' / '+(s.actions_minutes_budget||2000);
    const st=s.stats||{};const vals=[st.posts||0,st.scheduled||0,st.leads||0,st.reach||0];
    document.querySelectorAll('.cnt').forEach((el,i)=>el.dataset.v=vals[i]);
    countUp();
    const hb=document.getElementById('healthBox');hb.innerHTML='';
    (s.components||[]).forEach(c=>{
      const cls=c.status==='green'?'green':(c.status==='red'?'red':(c.status==='amber'?'amber':'gray'));
      const lbl={green:LANG==='hi'?'चालू':'Running',red:LANG==='hi'?'बंद':'Down',amber:LANG==='hi'?'ध्यान':'Warning',gray:LANG==='hi'?'बनना बाक़ी':'Not built yet'}[cls];
      const ico={green:'✓',red:'✖',amber:'⚠',gray:'○'}[cls];
      hb.innerHTML+='<div class="stat"><span>'+c.name+'</span><span class="pill '+cls+'">'+ico+' '+lbl+'</span></div>';
    });
  }
  const ms=DATA.messages;
  if(ms&&ms.messages&&ms.messages.length){
    const m=ms.messages[ms.messages.length-1];
    LAST_MSG={en:m.en,hi:m.hi};
    document.getElementById('msgBox').innerHTML='<div class="date">'+m.date+' · '+m.from+'</div><div>'+(LANG==='hi'?m.hi:m.en)+'</div>';
  }
  const p=DATA.progress;
  if(p){
    const pb=document.getElementById('planBox');pb.innerHTML='';
    let done=0;
    p.plan.forEach(d=>{
      if(d.status==='done')done++;
      const cls=d.status==='done'?'done':(d.status==='in_progress'?'now':'todo');
      const mark=d.status==='done'?'✓':d.day;
      pb.innerHTML+='<div class="day"><div class="dnum '+cls+'">'+mark+'</div><div class="dtxt"><div class="t">'+t(d,'title')+'</div>'+(t(d,'detail')?'<div class="d">'+t(d,'detail')+'</div>':'')+'</div></div>';
    });
    const prog=Math.max(7,Math.round((done+(p.plan.some(d=>d.status==='in_progress')?0.5:0))/7*100));
    setTimeout(()=>{document.getElementById('meterFill').style.width=prog+'%';},150);
    const dayNow=(p.plan.find(d=>d.status==='in_progress')||{}).day||Math.min(7,done+1);
    document.getElementById('sysline').textContent=LANG==='hi'?('सिस्टम: निर्माण जारी (दिन '+dayNow+'/7)'):('System: building (Day '+dayNow+' of 7)');
  }
  // approvals panel
  const ab=document.getElementById('approvalBox');
  if(DATA.cal&&DATA.cal.days){
    const ap=DATA.approvals||{};
    const todayStr=new Date(Date.now()+330*60000).toISOString().slice(0,10);
    const upcoming=DATA.cal.days.filter(d=>d.date>=todayStr).slice(0,7);
    if(upcoming.length){
      const qa=DATA.qa_report||{};
      const cust=DATA.customer_report||{};
      ab.innerHTML=upcoming.map(d=>{
        const st=ap[d.date];
        const chip=st==='approved'?'<span class="pill green">✓ '+(LANG==='hi'?'मंज़ूर':'Approved')+'</span>'
                 :st==='rejected'?'<span class="pill red">✖ '+(LANG==='hi'?'नामंज़ूर':'Rejected')+'</span>'
                 :'<span class="pill amber">⏳ '+(LANG==='hi'?'आपके फ़ैसले का इंतज़ार':'Awaiting your decision')+'</span>';
        const okU='https://github.com/'+REPO+'/issues/new?title='+encodeURIComponent('APPROVE '+d.date);
        const noU='https://github.com/'+REPO+'/issues/new?title='+encodeURIComponent('REJECT '+d.date)+'&body='+encodeURIComponent(LANG==='hi'?'वजह (छोटी सी लिख दें):\n':'Reason (short):\n');
        const btns=st?'':'<a class="abtn ok" target="_blank" href="'+okU+'">✅ '+(LANG==='hi'?'मंज़ूर':'Approve')+'</a><a class="abtn no" target="_blank" href="'+noU+'">❌ '+(LANG==='hi'?'नामंज़ूर':'Reject')+'</a>';
        const qv=qa[d.date];
        let qaBadge='';
        if(qv&&qv.verdict&&qv.verdict!=='skipped'&&qv.verdict!=='error'){
          const qcls=qv.verdict==='pass'?'green':(qv.verdict==='revise'?'amber':'red');
          const qlbl=LANG==='hi'?'AI समीक्षा (Gemini)':'AI review (Gemini)';
          const notes=(LANG==='hi'?qv.marketing_notes:qv.marketing_notes)||qv.note||'';
          qaBadge='<div class="pill '+qcls+'" style="margin-top:6px;display:block;white-space:normal;line-height:1.4">🎨 '+qlbl+' ('+(qv.score||'-')+'/10): '+notes+'</div>';
        }
        const cv=cust[d.date];
        let custBadge='';
        if(cv&&!cv.skipped&&!cv.error){
          const ccls=cv.would_stop_scrolling&&cv.would_trust_the_brand?'green':'amber';
          const clbl=LANG==='hi'?'ग्राहक की नज़र से (Kimi)':'Customer reaction (Kimi)';
          custBadge='<div class="pill '+ccls+'" style="margin-top:6px;display:block;white-space:normal;line-height:1.4">👤 '+clbl+' ('+(cv.score||'-')+'/10): '+(cv.gut_reaction||'')+'</div>';
        }
        return '<div class="appr"><a href="content/queue/'+d.date+'-ig.png" target="_blank"><img loading="lazy" src="content/queue/'+d.date+'-ig.png" alt=""></a>'+
          '<div class="ainfo"><div class="ad">'+d.date+' · 7:00 pm</div><div class="ah">'+(d.ig&&d.ig.hook_en||'')+'</div>'+chip+qaBadge+custBadge+'<div style="margin-top:8px">'+btns+'</div></div></div>';
      }).join('');
    } else {
      ab.innerHTML='<div class="empty">'+(LANG==='hi'?'अभी कोई आने वाला पोस्ट नहीं।':'No upcoming posts.')+'</div>';
    }
  }
  // leads
  const lb=document.getElementById('leadsBox');
  const ldr=DATA.lead_daily_report;
  document.getElementById('leadsSummary').textContent = ldr ? (LANG==='hi'?ldr.note_hi:ldr.note_en) : '';
  if(lb){
    const hot=(ldr&&ldr.hot_leads_awaiting_followup)||[];
    if(hot.length){
      lb.innerHTML=hot.map(h=>{
        return '<div class="stat"><span>🔥 '+(h.name||'-')+(h.city?' · '+h.city:'')+'</span><span class="pill red">'+h.score+'/100</span></div>';
      }).join('');
    } else if(DATA.leads && DATA.leads.leads && DATA.leads.leads.length){
      const recent=DATA.leads.leads.slice(-5).reverse();
      lb.innerHTML=recent.map(l=>{
        const cls=l.priority==='HOT'?'red':(l.priority==='WARM'?'amber':'gray');
        return '<div class="stat"><span>'+(l.name||(LANG==='hi'?'(नाम नहीं)':'(no name)'))+(l.city?' · '+l.city:'')+'</span><span class="pill '+cls+'">'+l.score+'/100</span></div>';
      }).join('');
    } else {
      lb.innerHTML='<div class="empty"><span class="ico">📥</span>'+(LANG==='hi'?'अभी कोई लीड नहीं — फ़ॉर्म तैयार है।':'No leads yet — the form is ready.')+'</div>';
    }
  }
  const llLink=document.getElementById('logLeadLink');
  if(llLink){
    const tmpl=LANG==='hi'
      ? 'Name:\nPhone:\nCity:\nProject type:\nBudget (INR):\nMessage:\n'
      : 'Name:\nPhone:\nCity:\nProject type:\nBudget (INR):\nMessage:\n';
    llLink.href='https://github.com/'+REPO+'/issues/new?title='+encodeURIComponent('NEW LEAD')+'&labels=new-lead&body='+encodeURIComponent(tmpl);
  }
  const wl=document.getElementById('writeLink');
  wl.href='https://github.com/'+REPO+'/issues/new?title='+encodeURIComponent('MESSAGE TO AURA')+'&labels=owner-message&body='+encodeURIComponent(LANG==='hi'?'यहाँ अपना संदेश लिखें:\n\n':'Write your message here:\n\n');
  const kl=document.getElementById('killLink');
  kl.href='https://github.com/'+REPO+'/issues/new?title='+encodeURIComponent('KILL SWITCH: PAUSE ALL PUBLISHING')+'&labels=kill-switch&body='+encodeURIComponent('Submit this issue to pause all posting immediately at the next run. / यह सबमिट करते ही अगली रन से सारी पोस्टिंग रुक जाएगी।');
}

function speakMsg(){
  const txt=LANG==='hi'?LAST_MSG.hi:LAST_MSG.en;
  if(!txt)return;
  const b=document.getElementById('speakBtn');
  const u=new SpeechSynthesisUtterance(txt);
  u.lang=LANG==='hi'?'hi-IN':'en-IN';
  u.onstart=()=>b.classList.add('speaking');
  u.onend=()=>b.classList.remove('speaking');
  speechSynthesis.cancel();speechSynthesis.speak(u);
}

function startMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast(LANG==='hi'?'इस ब्राउज़र में माइक सपोर्ट नहीं है — ✍️ बटन से लिखें':'Mic not supported here — use the ✍️ button');return;}
  const r=new SR();r.lang=LANG==='hi'?'hi-IN':'en-IN';r.interimResults=false;
  toast(LANG==='hi'?'🎙️ बोलिए…':'🎙️ Speak now…');
  r.onresult=e=>{
    const said=e.results[0][0].transcript;
    window.open('https://github.com/'+REPO+'/issues/new?title='+encodeURIComponent('MESSAGE TO AURA (voice)')+'&labels=owner-message&body='+encodeURIComponent(said),'_blank');
  };
  r.onerror=()=>toast(LANG==='hi'?'सुनाई नहीं दिया — फिर कोशिश करें':'Could not hear — try again');
  r.start();
}

setLang(LANG);tick();load();setInterval(load,120000);
</script>
