name: AURA
on:
  schedule:
    - cron: '15 */3 * * *'   # heartbeat: every 3h
    - cron: '30 13 * * *'    # publish: 19:00 IST
    - cron: '45 13 * * *'    # publish retry
    - cron: '0 6 * * 5'      # weekly content: Friday
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency: aura-state

jobs:
  heartbeat:
    if: github.event_name == 'issues' || github.event_name == 'workflow_dispatch' || github.event.schedule == '15 */3 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/heartbeat.py
      - run: |
          git config user.name "AURA" && git config user.email "aura@design-infra.bot"
          git add -A && (git diff --cached --quiet || git commit -m "heartbeat [skip ci]") && git push

  publish:
    if: github.event.schedule == '30 13 * * *' || github.event.schedule == '45 13 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PIN_ACCESS_TOKEN: ${{ secrets.PIN_ACCESS_TOKEN }}
          PIN_BOARD_ID: ${{ secrets.PIN_BOARD_ID }}
        run: python scripts/publisher.py
      - run: |
          git config user.name "AURA" && git config user.email "aura@design-infra.bot"
          git add -A && (git diff --cached --quiet || git commit -m "publish log [skip ci]") && git push

  weekly:
    if: github.event.schedule == '0 6 * * 5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          npm install playwright --no-audit --no-fund
          npx playwright install --with-deps chromium
      - run: python scripts/fetch_images.py "modern living room india" "modular kitchen" "bedroom interior warm"
        continue-on-error: true
      - run: node scripts/render_cards.mjs
      - run: |
          git config user.name "AURA" && git config user.email "aura@design-infra.bot"
          git add -A && (git diff --cached --quiet || git commit -m "weekly content [skip ci]") && git push
